[build]
  command = "npm run build"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "20"

# Netlify Identity + Git Gateway are enabled in the Netlify UI
# (Site settings > Identity > Enable Identity + Git Gateway).
# Invite office editors by email; they log in at /admin.

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
