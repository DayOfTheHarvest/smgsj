backend:
  name: git-gateway
  branch: main # parish org repo default branch

# Pages + weekly presider roster. No approval flow, no roles (plan Sec 4).
# Staff hand-links new pages; header nav stays code-owned.
publish_mode: simple
media_folder: public/uploads
public_folder: /uploads
editorial_workflow: false
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: pages
    label: Pages (one file per topic, EN + ES + VI)
    description: 'Safe to edit text freely — you cannot break the site layout from here. Only rule: never change the page address.'
    folder: src/content/pages
    create: true # staff can add pages; filename comes from the page address below
    delete: false # never delete — hide by removing its menu link instead
    extension: md
    format: frontmatter
    slug: '{{slug_key}}'
    fields:
      - label: 'Page address (lowercase-with-dashes, e.g. new-ministry — set once, then never change)'
        name: slug_key
        widget: string
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, numbers, and dashes only']
        hint: 'WARNING: this becomes the web address (/en/your-address/). Changing it later breaks links.'
      - label: 'Title (English, required, max 60)'
        name: title_en
        widget: string
        required: true
        pattern: ['^.{1,60}$', 'Keep under 60 characters']
        hint: 'Shown in the header and Google results. Keep short.'
      - label: 'Body (English, required)'
        name: body
        widget: markdown
        required: false
        hint: 'Main content. Bold, italic, lists, links, and pictures only. For every picture, fill in its description box so blind visitors hear what it shows.'
        buttons: [bold, italic, list, bulleted-list, numbered-list, link, image]
        editor_components: []
      - label: 'Title (Español, optional)'
        name: title_es
        widget: string
        required: false
        hint: 'Leave empty to show English + banner. Pastor approves sacramental Spanish.'
      - label: 'Body (Español, optional)'
        name: body_es
        widget: markdown
        required: false
        hint: 'Leave empty to show English + banner.'
        buttons: [bold, italic, list, bulleted-list, numbered-list, link, image]
        editor_components: []
      - label: 'Title (Tiếng Việt, optional)'
        name: title_vi
        widget: string
        required: false
        hint: 'Leave empty to show English + banner. Pastor approves sacramental Vietnamese.'
      - label: 'Body (Tiếng Việt, optional)'
        name: body_vi
        widget: markdown
        required: false
        hint: 'Leave empty to show English + banner.'
        buttons: [bold, italic, list, bulleted-list, numbered-list, link, image]
        editor_components: []
      - label: 'Last updated'
        name: updated
        widget: datetime
        required: false
        hint: 'Auto-touch on save.'
  - name: schedule
    label: Mass schedule & presiders (weekly)
    description: 'Each Mass row carries its own presider name, so nothing can silently mismatch.'
    files:
      - name: locations
        label: Location names (translations)
        file: src/data/locations.json
        description: How each place name reads in each language. Pick the place from the dropdown, then type its name in each language.
        fields:
          - label: 'Locations'
            name: locations
            widget: list
            hint: 'Do not add or remove rows without the web developer volunteer — the Mass list matches by the English name.'
            fields:
              - label: 'Place (must match Mass list)'
                name: name
                widget: select
                options: ['Church', 'Patio', 'Divine Mercy Chapel', "Viet. Martyr's Shrine"]
              - { label: 'English', name: en, widget: string }
              - { label: 'Español', name: es, widget: string }
              - { label: 'Tiếng Việt', name: vi, widget: string }
      - name: masses
        label: Mass times, places & presiders
        file: src/data/masses.json
        description: The 21 weekly Masses, each with its presider. Everything is picked from lists except names and times.
        fields:
          - label: 'Sunday schedule display (homepage Mass block)'
            name: display
            widget: object
            hint: 'Normally leave on Schedule. Pick Image for a special week to show an uploaded picture instead — switch back after.'
            fields:
              - label: 'Show'
                name: mode
                widget: select
                options: ['schedule', 'image']
              - { label: 'Picture (Media library)', name: image, widget: image, required: false }
              - { label: 'Picture link (optional)', name: link, widget: string, required: false }
          - label: 'Week of (Sunday date — which week these presiders cover)'
            name: week_of
            widget: string
            hint: 'Update this every week alongside the presider names.'
          - label: 'Masses'
            name: masses
            widget: list
            hint: 'Pick day, language, and place from the lists. Do not add or remove rows without the web developer volunteer.'
            fields:
              - label: 'Service'
                name: service
                widget: select
                options: ['Saturday', 'Sunday', 'Weekday']
              - label: 'Day'
                name: day
                widget: select
                options: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Mon-Fri', '1st Friday']
              - label: 'Start time (e.g. 4:00pm)'
                name: time
                widget: string
                pattern: ['^\\d{1,2}:\\d{2}\\s?(am|pm|AM|PM)$', 'Time like 4:00pm']
                hint: 'Time only — the day comes from the Day picker above.'
              - label: 'Extra tag at the end (almost always leave blank — only for special cases like - Patio)'
                name: suffix
                widget: string
                required: false
              - label: 'Language'
                name: lang
                widget: select
                options: ['English', 'Español', 'Vietnamese', 'Tagalog']
              - label: "Place (type exactly: Church, Patio, Divine Mercy Chapel, Viet. Martyr's Shrine — or a new place)"
                name: location
                widget: string
                hint: 'Use one of the four places above so the translation appears automatically. A brand-new place shows exactly as typed until its translations are added under Location names.'
              - label: 'Note (optional, e.g. Livestream)'
                name: note
                widget: string
                required: false
              - label: 'Presider for this Mass (e.g. Fr. Andrew — blank means TBD)'
                name: presider
                widget: string
                required: false
      - name: schedule-info
        label: Confession & office hours text
        file: src/data/schedule-info.json
        fields:
          - label: 'Confession'
            name: confession
            widget: object
            fields:
              - label: 'Day'
                name: day
                widget: object
                fields:
                  - { label: 'English (e.g. Every Saturday)', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - label: 'Time'
                name: time
                widget: object
                fields:
                  - { label: 'English (e.g. 3:00 PM – 3:45 PM)', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
          - label: 'Office hours'
            name: office
            widget: object
            hint: 'Write two lines per language. Line 1: open days and times. Line 2: closed days. Example line: Tuesday – Friday: 10:00 a.m. – 5:00 p.m.'
            fields:
              - { label: 'English', name: en, widget: text }
              - { label: 'Español', name: es, widget: text }
              - { label: 'Tiếng Việt', name: vi, widget: text }
  - name: directory
    label: Staff directory
    files:
      - name: staff
        label: Staff members
        file: src/data/staff.json
        description: Names, roles, phone numbers, and bios. Photos are managed by the web developer volunteer.
        fields:
          - label: 'Members'
            name: members
            widget: list
            fields:
              - { label: 'Page code (leave alone — used behind the scenes)', name: slug, widget: string }
              - { label: 'Name', name: name, widget: string }
              - { label: 'Role', name: role, widget: string }
              - { label: 'Phone', name: phone, widget: string }
              - label: 'Photo'
                name: photo
                widget: image
                required: false
                hint: 'WARNING: do not change unless replacing the portrait. Use Choose image, never type a path.'
              - { label: 'Bio (blank = no profile page link)', name: bio, widget: text, required: false }
  - name: bulletins
    label: Bulletins (weekly)
    files:
      - name: bulletin-list
        label: Bulletin links
        file: src/data/bulletins.json
        description: Newest first. Upload the PDF via Media first, then paste its /uploads/ link here.
        fields:
          - label: 'Show bulletins from the past N weeks (0 = show all)'
            name: weeks
            widget: number
            hint: 'The card stays short automatically — older bulletins drop off by date.'
          - label: 'Bulletins (newest first)'
            name: bulletins
            widget: list
            fields:
              - { label: 'Date', name: date, widget: string }
              - { label: 'Label (e.g. October 11, 2026)', name: label, widget: string }
              - { label: 'PDF link', name: url, widget: string }
  - name: announcements
    label: Homepage carousel
    files:
      - name: slides
        label: Rotating slides (pastor letter + announcements)
        file: src/data/announcements.json
        description: First slide shows on load; slides rotate every 5 seconds. Upload wide banners (~1920px) via Media.
        fields:
          - label: 'Slides'
            name: slides
            widget: list
            fields:
              - { label: 'Banner image', name: image, widget: image }
              - { label: 'Alt text (describe the banner)', name: alt, widget: string }
              - { label: 'Image width in pixels (1920 matches the current banners)', name: width, widget: number, required: false }
              - { label: 'Image height in pixels (480 matches the current banners)', name: height, widget: number, required: false }
              - { label: 'Link (/campaign/ for parish pages, full URL for PDFs)', name: link, widget: string }
              - { label: 'Caption (read aloud for blind visitors)', name: caption, widget: string }
              - label: 'Seconds on screen (each slide can differ)'
                name: seconds
                widget: number
                hint: 'How long this slide shows before rotating. Blank = 5 seconds.'
  - name: site
    label: 'Site settings, navigation & homepage — CAREFUL'
    files:
      - name: settings
        label: Contact info & external links
        file: src/data/settings.json
        description: >-
          WARNING: these values appear in the header and footer of EVERY page.
          Phone, email, address, emergency numbers, Giving/Payment, Calendar,
          YouTube, Facebook, Flocknote. Double-check every character — a wrong
          link here breaks donations and contact site-wide.
        fields:
          - { label: 'Phone (e.g. 408-363-2300)', name: phone, widget: string }
          - { label: 'Header logo (pick from uploads)', name: logo, widget: image }
          - { label: 'Parish name (browser tabs, headers)', name: site_name, widget: string }
          - { label: 'Shrine address', name: shrine_address, widget: string }
          - { label: 'Email', name: email, widget: string }
          - { label: 'Address', name: address, widget: string }
          - { label: 'Emergency EN/ES', name: emergency_en_es, widget: string }
          - { label: 'Emergency VI', name: emergency_vi, widget: string }
          - { label: 'Facility email', name: facility_email, widget: string }
          - { label: 'Online Giving URL', name: giving, widget: string }
          - { label: 'Online Payment URL', name: payment, widget: string }
          - { label: 'Calendar request URL', name: calendar_suggest, widget: string }
          - { label: 'Calendar view URL', name: calendar_view, widget: string }
          - label: 'Full-calendar embed URL (shown on the Calendar page)'
            name: calendar_embed
            widget: string
            hint: 'WARNING: must be the CalendarWiz embed link. A wrong URL shows a blank calendar.'
          - label: "Today's-events embed URL (shown on the Calendar page)"
            name: today_embed
            widget: string
            hint: 'WARNING: must be the CalendarWiz day-view embed link. A wrong URL shows a blank box.'
          - { label: 'YouTube channel URL', name: youtube, widget: string }
          - { label: 'Facebook page URL', name: facebook, widget: string }
          - { label: 'Flocknote signup URL', name: flocknote, widget: string }
          - label: 'Flocknote group signup endpoint (do not change without the web developer volunteer)'
            name: flocknote_signup
            widget: string
            hint: 'WARNING: posts subscriptions to the parish Flocknote group. A wrong URL silently sends signups nowhere.'
          - { label: 'EthicsPoint report link', name: ethicspoint, widget: string }
          - { label: 'EthicsPoint phone', name: ethicspoint_phone, widget: string }
      - name: navigation
        label: Header menu structure
        file: src/data/navigation.json
        description: >-
          WARNING: this is the header menu for the whole site. A wrong link
          breaks navigation everywhere; an empty label shows a blank menu item.
          Links must start AND end with / (e.g. /mass-times/). Ask the web
          volunteer before adding or removing menu items.
        fields:
          - label: 'Menu groups'
            name: groups
            widget: list
            fields:
              - { label: 'Group code (leave alone — used behind the scenes)', name: id, widget: string }
              - label: 'Group name'
                name: label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - { label: 'Group link (e.g. /about-us/)', name: href, widget: string }
              - label: 'Submenu links'
                name: children
                widget: list
                fields:
                  - label: 'Link name'
                    name: label
                    widget: object
                    fields:
                      - { label: 'English', name: en, widget: string }
                      - { label: 'Español', name: es, widget: string }
                      - { label: 'Tiếng Việt', name: vi, widget: string }
                  - { label: 'Link (e.g. /staff/)', name: href, widget: string }
          - label: 'Quick links (Mass Times + Contact buttons)'
            name: quick_links
            widget: list
            fields:
              - { label: 'Link code (leave alone — used behind the scenes)', name: id, widget: string }
              - label: 'Link name'
                name: label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - { label: 'Link (e.g. /mass-times/)', name: href, widget: string }
      - name: homepage-text
        label: Homepage welcome & events
        file: src/data/homepage.json
        description: >-
          The pastor's welcome quote and the three event cards on the homepage.
          Changing the pastor's words needs the pastor's approval first.
        fields:
          - label: 'Page layout (order + visibility of homepage sections)'
            name: layout
            widget: object
            fields:
              - label: 'Section order (top to bottom — drag to reorder)'
                name: order
                widget: list
                hint: 'WARNING: every row must be one of: carousel, hero, actions, schedule, events, body, office, flocknote, catholic. A typo hides that section.'
                field:
                  name: section
                  widget: select
                  options: ['carousel', 'hero', 'actions', 'schedule', 'events', 'custom', 'body', 'office', 'flocknote', 'catholic']
              - label: 'Hidden sections'
                name: hidden
                widget: list
                hint: 'Add a section here to hide it without deleting its content. Remove the row to show it again.'
                field:
                  name: section
                  widget: select
                  options: ['carousel', 'hero', 'actions', 'schedule', 'events', 'custom', 'body', 'office', 'flocknote', 'catholic']
          - label: 'Hero banner (top welcome block)'
            name: hero
            widget: object
            fields:
              - { label: 'Eyebrow line (small caps above title)', name: eyebrow, widget: string, required: false }
              - label: 'Title'
                name: title
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - label: 'Subtitle'
                name: subtitle
                widget: object
                fields:
                  - { label: 'English', name: en, widget: text }
                  - { label: 'Español', name: es, widget: text }
                  - { label: 'Tiếng Việt', name: vi, widget: text }
              - label: 'Hero buttons'
                name: buttons
                widget: list
                hint: 'WARNING: parish links must start AND end with / . A wrong link makes a dead button.'
                fields:
                  - label: 'Label'
                    name: label
                    widget: object
                    fields:
                      - { label: 'English', name: en, widget: string }
                      - { label: 'Español', name: es, widget: string }
                      - { label: 'Tiếng Việt', name: vi, widget: string }
                  - { label: 'Link', name: link, widget: string }
                  - label: 'Color'
                    name: style
                    widget: select
                    options: ['gold', 'light', 'primary', 'outline']
          - label: "Pastor's welcome quote (needs pastor approval to change)"
            name: pastor_quote
            widget: text
          - label: 'Event cards'
            name: events
            widget: list
            fields:
              - label: 'Icon (pick from the list)'
                name: icon
                widget: select
                options: ['users', 'church', 'star', 'calendar', 'heart', 'news', 'form', 'phone', 'mail', 'clock', 'info']
                required: false
              - label: 'Title'
                name: title
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - label: 'Text'
                name: text
                widget: object
                fields:
                  - { label: 'English', name: en, widget: text }
                  - { label: 'Español', name: es, widget: text }
                  - { label: 'Tiếng Việt', name: vi, widget: text }
              - label: 'Link (a parish page like /volunteer/, a full web address, or a @shortcut word — blank = no link)'
                name: link
                widget: string
                required: false
                hint: 'WARNING: parish page addresses must start AND end with / . You can also type a @shortcut word (@giving @payment @calendar-suggest @calendar-view @flocknote @youtube) — those follow Site settings automatically. A wrong address makes a dead button.'
              - label: 'Link label'
                name: link_label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string, required: false }
                  - { label: 'Español', name: es, widget: string, required: false }
                  - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
          - label: 'Facility line (under event cards)'
            name: facility
            widget: object
            fields:
              - label: 'Reservation link label'
                name: link_label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - label: 'Closing sentence'
                name: tail
                widget: object
                fields:
                  - { label: 'English', name: en, widget: text }
                  - { label: 'Español', name: es, widget: text }
                  - { label: 'Tiếng Việt', name: vi, widget: text }
          - label: 'Custom sections (whole new blocks staff can add)'
            name: custom
            widget: list
            hint: 'Each row is a titled block of cards, placed together at the Custom spot in Page layout order. Add as many blocks as needed.'
            fields:
              - label: 'Block heading'
                name: title
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string, required: false }
                  - { label: 'Español', name: es, widget: string, required: false }
                  - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
              - label: 'Cards in this block'
                name: cards
                widget: list
                fields:
                  - label: 'Icon (pick from the list)'
                    name: icon
                    widget: select
                    options: ['users', 'church', 'star', 'calendar', 'heart', 'news', 'form', 'phone', 'mail', 'clock', 'info']
                    required: false
                  - label: 'Heading'
                    name: title
                    widget: object
                    fields:
                      - { label: 'English', name: en, widget: string, required: false }
                      - { label: 'Español', name: es, widget: string, required: false }
                      - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
                  - label: 'Text'
                    name: text
                    widget: object
                    fields:
                      - { label: 'English', name: en, widget: text, required: false }
                      - { label: 'Español', name: es, widget: text, required: false }
                      - { label: 'Tiếng Việt', name: vi, widget: text, required: false }
                  - { label: 'Picture (Media library)', name: image, widget: image, required: false }
                  - { label: 'Button link (blank = no button)', name: link, widget: string, required: false }
                  - label: 'Button label'
                    name: link_label
                    widget: object
                    fields:
                      - { label: 'English', name: en, widget: string, required: false }
                      - { label: 'Español', name: es, widget: string, required: false }
                      - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
          - label: 'Diocesan block (icons at page end)'
            name: catholic
            widget: object
            fields:
              - label: 'Icon links (add, remove, or reorder)'
                name: icons
                widget: list
                hint: 'WARNING: use the Media library images already uploaded. Deleting all rows removes the icon row.'
                fields:
                  - { label: 'Image (pick from uploads)', name: image, widget: image }
                  - { label: 'Alt text', name: alt, widget: string }
                  - { label: 'Link', name: link, widget: string }
                  - { label: 'Width (px)', name: width, widget: number }
                  - { label: 'Height (px)', name: height, widget: number }
              - label: 'EthicsPoint name'
                name: ethics_name
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - label: 'Report-online label'
                name: ethics_report
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
      - name: fundraisers
        label: Fundraisers (thermometer + donate button)
        file: src/data/fundraisers.json
        description: >-
          Each row powers one fundraiser page (matched by page address). To add
          a fundraiser: create its page under Pages first, then add its money
          row here with the same address.
        fields:
          - label: 'Fundraisers'
            name: fundraisers
            widget: list
            fields:
              - label: 'Page address (must match the fundraiser page, e.g. campaign)'
                name: id
                widget: string
                hint: 'WARNING: must match the page address exactly, or no thermometer appears.'
              - label: 'Title'
                name: title
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - { label: 'Goal (dollars, numbers only)', name: goal, widget: number }
              - { label: 'Raised so far (dollars, numbers only)', name: pledged, widget: number }
              - { label: 'As of (date)', name: updated, widget: string }
              - { label: 'Donate link', name: donate_link, widget: string }
              - label: 'Donate button label'
                name: donate_label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
      - name: action-cards
        label: Homepage action cards
        file: src/data/actions.json
        description: >-
          The cards below the welcome banner. Add, remove, or reorder cards.
          Each card has a kind (bulletin list, link button, or text only).
        fields:
          - label: 'Cards'
            name: cards
            widget: list
            fields:
              - label: 'Icon (pick from the list — no emoji needed)'
                name: icon
                widget: select
                options: ['news', 'heart', 'card', 'form', 'calendar', 'users', 'church', 'phone', 'mail', 'clock', 'star', 'info']
                required: false
              - label: 'Title'
                name: title
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string }
                  - { label: 'Español', name: es, widget: string }
                  - { label: 'Tiếng Việt', name: vi, widget: string }
              - label: 'Text (blank for bulletin-list cards)'
                name: text
                widget: object
                fields:
                  - { label: 'English', name: en, widget: text, required: false }
                  - { label: 'Español', name: es, widget: text, required: false }
                  - { label: 'Tiếng Việt', name: vi, widget: text, required: false }
              - { label: 'Button link (blank = text-only card)', name: link, widget: string, required: false, hint: 'A parish page (/requests/), a full web address, or a @shortcut word (@giving @payment @calendar-suggest @calendar-view @flocknote @youtube).' }
              - label: 'Button label'
                name: link_label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string, required: false }
                  - { label: 'Español', name: es, widget: string, required: false }
                  - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
              - label: 'Button color'
                name: style
                widget: select
                options: ['primary', 'gold', 'outline']
              - { label: 'Second link (optional, e.g. Online Payment)', name: extra_link, widget: string, required: false }
              - label: 'Second link label'
                name: extra_label
                widget: object
                fields:
                  - { label: 'English', name: en, widget: string, required: false }
                  - { label: 'Español', name: es, widget: string, required: false }
                  - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
              - label: 'Card kind (what this card shows)'
                name: kind
                widget: select
                options:
                  - { label: 'Bulletin list (latest bulletins)', value: bulletins }
                  - { label: 'Link button', value: link }
                  - { label: 'Text only', value: text }
                hint: 'WARNING: only ONE card should be a bulletin list.'
  - name: updates
    label: Notices, forms & galleries
    files:
      - name: notice
        label: Urgent site-wide notice banner
        file: src/data/notice.json
        description: Shows a gold alert bar on EVERY page. Turn ON only for urgent news (closures, emergencies, holy-day changes) and turn OFF when it expires.
        fields:
          - label: 'Show the banner (ON = visible site-wide)'
            name: enabled
            widget: boolean
          - label: 'Message'
            name: text
            widget: object
            fields:
              - { label: 'English', name: en, widget: text }
              - { label: 'Español', name: es, widget: text }
              - { label: 'Tiếng Việt', name: vi, widget: text }
          - { label: 'Link (optional — blank = no link)', name: link, widget: string, required: false }
          - label: 'Link label'
            name: link_label
            widget: object
            fields:
              - { label: 'English', name: en, widget: string, required: false }
              - { label: 'Español', name: es, widget: string, required: false }
              - { label: 'Tiếng Việt', name: vi, widget: string, required: false }
      - name: forms
        label: Request form links
        file: src/data/forms.json
        description: The request-forms page list. Update URLs when yearly registrations roll over (e.g. 2026-2027 → 2027-2028). Parish-page links must start AND end with / .
        fields:
          - label: 'Forms'
            name: forms
            widget: list
            fields:
              - { label: 'Label (keep all 3 languages in one line)', name: label, widget: string }
              - { label: 'Link', name: url, widget: string, hint: 'A parish page, a full web address, or a @shortcut word (@giving @payment @calendar-suggest @calendar-view @flocknote @youtube).' }
      - name: galleries
        label: Photo galleries
        file: src/data/galleries.json
        description: Gallery titles with photo counts. Paste the Google Photos album link when an album moves over; blank link shows the title without a link.
        fields:
          - label: 'Galleries'
            name: galleries
            widget: list
            fields:
              - { label: 'Title', name: title, widget: string }
              - { label: 'Photo count', name: photos, widget: number }
              - { label: 'Album link (blank = no link yet)', name: url, widget: string, required: false }
